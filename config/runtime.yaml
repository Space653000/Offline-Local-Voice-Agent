# 語音/LLM管線的可調參數。跟permissions.yaml/tools.yaml不同，這些不是安全關鍵資料，
# 但一樣外部化出來——原本這些數字散落在 listen_loop.py/full_pipeline.py/frontdesk/*.py
# 好幾個檔案裡各自寫死（例如同一個LLM URL在4個檔案各抄一份），改一個值要改好幾個地方，
# 也讓使用者想調整時得去翻程式碼，不是這個專案希望的樣子。

llm:
  # llama.cpp server的OpenAI相容端點，全專案唯一的LLM推論來源
  url: "http://127.0.0.1:8811/v1/chat/completions"

wake_word:
  # openWakeWord預測分數超過這個門檻才算偵測到「嗨小助理」
  threshold: 0.5

endpoint_detection:
  # 🔴 對照 docs/08_Executive_Summary_and_User_SOP.md §4.1「端點偵測延遲的架構取捨」。
  # 2026-09-18使用者已回覆選項B（縮短等待），並提到「其他雲端AI都預設1秒」當參考基準。
  # 這裡把兩段安全邊際各縮短：
  #   end_of_speech_silence_chunks: 10(0.8秒) -> 6(0.48秒)
  #   quiet_chunks_to_confirm_wake_ended: 4(0.32秒) -> 3(0.24秒)
  # 兩段加總從原本1.12秒降到0.72秒，縮短約0.4秒——刻意不是砍到接近0（P1階段已經踩過坑：
  # 緩衝期太短會把使用者話還沒講完就誤判成講完，把話切斷），是折衷後的中等幅度調整。
  # 純ASR轉錄本身還要約1.5秒，物理上很難把整體壓到1秒，這裡只縮短「確認你講完了」這段
  # 安全邊際能縮的部分。調整後有沒有真的變快、有沒有增加誤切話尾的風險，都要用
  # progress/p4_kpi_measurement/run_voice_latency_test.py重新實測驗證，不能只憑理論估計。
  end_of_speech_silence_chunks: 6   # 連續6個80ms chunk（=0.48秒）偵測不到語音才當作講完了
  max_recording_chunks: 150         # 最長錄12秒，避免一直錄下去
  quiet_chunks_to_confirm_wake_ended: 3   # 喚醒後要先連續偵測到這麼多安靜chunk，才算喚醒詞尾音真的講完了
  max_wait_for_quiet_chunks: 40           # 最多等3.2秒讓喚醒詞尾音安靜下來，避免異常狀況卡死

safety:
  emergency_hotkey: "ctrl+shift+f12"  # docs/01第10節明訂的緊急停止熱鍵
  sleep_gap_threshold_sec: 5.0        # 偵測到系統睡眠/喚醒的時間縫隙門檻
