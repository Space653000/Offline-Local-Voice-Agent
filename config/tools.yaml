# 應用程式白名單（對照 open_app 工具的安全設計：只能開這裡列出的程式，不接受任意字串）。
# 這是安全邊界，跟 executor/audit_db.py 的 known_apps 表（單純「用過的紀錄」）是兩件事——
# 那張表不會反過來放寬這份白名單。
#
# 對照 docs/07 進度報告第11節指出的落差：原本寫死在 tools/basic_tools.py 的 Python 字典裡。

# 對照 docs/06「P3驗收劇本真的跑通了」一節抓到的真實bug：原本這裡只寫"notepad.exe"這種
# 裸執行檔名稱，靠subprocess.Popen()自己的PATH解析找執行檔——這台機器的PATH裡同時有
# C:\Users\<user>\AppData\Local\Microsoft\WindowsApps\notepad.exe（新版應用程式的「執行
# 別名」轉接殼層）跟真正的C:\Windows\System32\notepad.exe，裸名稱解析會不穩定甚至啟動失敗
# （之前一度誤判成「這個環境UWP應用程式起不來」，後來才發現是PATH解析問題，不是相容性問題）。
# 改成明確寫完整路徑，不靠PATH自己猜，這樣才是真正穩定的修法。
known_apps:
  notepad: C:\Windows\System32\notepad.exe
  記事本: C:\Windows\System32\notepad.exe
  calculator: C:\Windows\System32\calc.exe
  小算盤: C:\Windows\System32\calc.exe
  explorer: C:\Windows\explorer.exe
  檔案總管: C:\Windows\explorer.exe
  settings: "ms-settings:"
  設定: "ms-settings:"

# Windows 11 上有些內建程式（記事本、小算盤...）現在是 MSIX 封裝的商店應用程式，
# system32 裡的 .exe 只是個轉發殼層，啟動後會馬上結束，真正的視窗跑在完全不同的 PID 底下。
# 直接信任 Popen 回傳的 pid 會抓錯（P3 實測踩到的坑），改成比對啟動前後的行程差異來抓到真正的
# PID，這張表記錄「殼層exe」對應「真正的行程名稱」。
real_process_name:
  notepad.exe: Notepad.exe
  calc.exe: CalculatorApp.exe
